<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  /*
    The showcase frame.
    THE ACCENT IS #8A4B12, AND ORACLE RED IS DROPPED ENTIRELY. That is a closed
    founder decision, re-confirmed 8 Aug 2026: PRODUCT.md names Oracle's own
    marketing as an anti-reference and the Terms disclaim affiliation, so
    borrowing Oracle's red contradicts both. Do not re-derive the accent from
    a token file; it is fixed here and pinned in the pixels by
    check-chrome-colour.py. DESIGN.md was rewritten to the warm Instrument
    Amber system on 15 Aug 2026 and no longer carries the old red.
    Section 4 of Showcase/STANDARDS.md names the dropped value and
    the reason; it is deliberately not repeated here, because a guard in
    test/showcase.test.js reads this file looking for it. A second guard,
    scripts/showcase/check-chrome-colour.py, measures the shipped pixels, so
    restoring the red here fails the build twice.
    No webfonts: an asset that renders differently depending on whether a font
    server answered is not a reproducible asset. The stacks below resolve on
    any machine that has a browser.
    No inline script anywhere in this template, on purpose. A dead script is
    invisible in markup and this page has no need of one.
  */
  :root{
    --field:#F7F5F1; --surface:#FFFFFF; --ink:#1C1917; --ink2:#4A443D;
    --ink3:#6A6156; --hairline:#E0D9CD; --action:#8A4B12; --signal:#E0A020;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--field)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  .frame{width:{{CANVAS_W}}px;padding:{{PAD}}px;background:var(--field)}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
  .wordmark{font-size:19px;font-weight:700;letter-spacing:-.018em;display:flex;align-items:center;gap:9px}
  .wordmark .dot{width:9px;height:9px;border-radius:50%;background:var(--action);display:inline-block}
  .tag{
    font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  }
  .shot{
    border:1px solid var(--hairline);border-radius:14px;overflow:hidden;
    background:var(--surface);box-shadow:0 18px 44px rgba(28,25,23,.11);line-height:0;
  }
  .shot img{display:block;width:{{IMG_W}}px;height:auto}
  footer{display:flex;align-items:flex-start;gap:12px;margin-top:22px}
  .pill{
    flex:none;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
    color:var(--action);border:1px solid var(--action);border-radius:999px;padding:4px 10px;
    line-height:1.1;white-space:nowrap;
  }
  .cap{font-size:13px;line-height:1.5;color:var(--ink2);max-width:78ch}
  .cap b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="wordmark"><span class="dot"></span>OraDiscuss</div>
    <div class="tag">{{TAG}}</div>
  </header>
  <div class="shot"><img src="{{IMG_SRC}}" alt="{{TITLE}}"></div>
  <footer>
    <span class="pill">Synthetic lab data</span>
    <span class="cap"><b>{{PROVENANCE}}</b> {{DETAIL}}</span>
  </footer>
</div>
</body>
</html>
