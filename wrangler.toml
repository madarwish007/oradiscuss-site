# Root wrangler config for oradiscuss-site.
#
# Build pipeline:
#   npm run build                        # Astro -> ./dist
#   npx wrangler deploy --env preview    # PREVIEW: where all work lands
#   npx wrangler deploy                  # PRODUCTION: founder gate, never a model
#
# worker.js is the edge entry: it blocks scanner probes, serves /api/* from the
# system layer (D1 / KV / R2), and hands everything else to the static Astro
# build through the ASSETS binding.
#
# The OAuth proxy (worker-oauth/) is a SEPARATE Worker with its own
# wrangler.toml and is deployed independently.
#
# PREVIEW-FIRST LAW: production deploys are a founder action. See BUILD_PLAN.md.

name = "oradiscuss-site"
main = "worker.js"
compatibility_date = "2026-04-11"

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve /404/index.html on unknown paths so our styled 404 page renders.
not_found_handling = "404-page"
# Without this, Static Assets answers browser NAVIGATIONS to /api/* with the
# 404 page before the Worker ever runs, while fetch()-shaped requests fall
# through correctly. Verified by replaying both request shapes with curl.
# This is not cosmetic: the Phase 6 download link is a navigation.
#
# /changelog/ is listed for the opposite reason: the built page DOES exist as an
# asset, so without this the Worker never runs and the page ships with its
# "could not be read" fallback instead of the releases from D1.
#
# /watch/* is listed for BOTH reasons at once. The archive index exists as an
# asset and needs the Worker to fill it, and a per brief URL does not exist as
# an asset at all: it is rendered into the built /watch/brief/ shell from D1, so
# without this line every published brief would answer with the 404 page.
run_worker_first = ["/api/*", "/changelog", "/changelog/", "/watch", "/watch/*"]

[observability]
enabled = true

# ---------------------------------------------------------------- PRODUCTION

[vars]
ENVIRONMENT = "production"
# The origin the SCHEDULED cycle builds the brief link from. A cron has no
# Request, so this cannot be derived the way the HTTP paths derive it, and a
# member email whose link points at the wrong host is not recoverable once it is
# sent. worker/watch-breaker.js defaults to this exact value when the var is
# absent, and accepts https only.
SITE_ORIGIN = "https://oradiscuss.com"

[[d1_databases]]
binding = "DB"
database_name = "oradiscuss"
database_id = "acbcb2c0-ae7a-4d16-a76c-5c79a0bf14a4"

[[kv_namespaces]]
binding = "ENTITLEMENT"
id = "1c27596118cd4e04b9119e866fd42c22"

[[r2_buckets]]
binding = "PACKS"
bucket_name = "oradiscuss-assets"

# Workers-native rate limiting. Dashboard WAF rules are a separate, additive
# founder action; this binding is what the API routes enforce themselves.
# NOTE: this is the `unsafe.bindings` form. The `[[ratelimit]]` form was tried
# first and wrangler silently ignored it, producing a Worker with no rate
# limiter and code that degraded quietly. Verified by reading the binding list
# printed at deploy time, which is the only trustworthy confirmation.
[unsafe]
bindings = [
  { name = "API_RATE_LIMIT", type = "ratelimit", namespace_id = "1001", simple = { limit = 60, period = 60 } },
  # A second, much tighter limiter for the endpoints that take a transaction
  # reference: /api/download, /api/reissue and /api/entitlement/delete. They are
  # the only routes where a caller can test whether a reference exists, so they
  # get five attempts a minute rather than sixty. The code FAILS CLOSED when
  # this binding is absent: an unlimited reference oracle is a worse failure
  # than a download counter that says it is shut.
  { name = "REISSUE_RATE_LIMIT", type = "ratelimit", namespace_id = "1002", simple = { limit = 5, period = 60 } }
]

# ------------------------------------------------------------- WEBHOOK RETRY
#
# READ THIS BEFORE THE NEXT DEPLOY. These queues are DECLARED here and do NOT
# exist on the account yet. A deploy carrying a queue binding whose remote queue
# is missing FAILS. Create them once, per environment:
#
#   npx wrangler queues create webhook-retry
#   npx wrangler queues create webhook-retry-preview
#
# Nothing in this branch created them, deliberately: creating remote resources
# is not this seat's to do. If the consolidated preview deploy must go out
# before they exist, comment out the four queue blocks (here and under
# [env.preview]) and the retry path degrades honestly, because worker/webhook.js
# treats the binding as optional: a webhook that cannot be queued is still
# written to the D1 `webhook_failure` table and then answered with a 500, so the
# Merchant of Record redelivers it. Nothing is dropped either way.
#
# There is no dead letter QUEUE on purpose. `webhook_failure` in D1 is the dead
# letter record, it is written on the first failure rather than after the last
# retry, and it is queryable. A second queue would add a resource that has to be
# created and watched to tell us something D1 already holds.

[[queues.producers]]
binding = "WEBHOOK_RETRY"
queue = "webhook-retry"

[[queues.consumers]]
queue = "webhook-retry"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5

# ------------------------------------------------------- SECURITY WATCH CRON
#
# READ THIS BEFORE THE NEXT PRODUCTION DEPLOY. This trigger is DECLARED here and
# ARMING IT IS A FOUNDER ACTION, because a production deploy is one. Nothing in
# this branch armed it: no seat deployed anything.
#
# WHAT IT RUNS, AND ON WHOSE AUTHORITY. worker.js `scheduled` calls
# runWatchCycle, which drafts, runs the CIRCUIT BREAKER, and then publishes and
# mails the member list when every check passes. Founder ruling 9 Aug 2026,
# verbatim: "Monthly is okay, and that should be automated workflow without any
# human intervention, as a Founder, i need to get an aknowledgement about the
# updated kits only." That reverses his own 5 Aug gate under which publishing
# and sending were founder-only, and this deploy is the moment it takes effect.
#
# WHAT THIS SCHEDULE DOES AND DOES NOT PROMISE, stated plainly because a live
# legal page carries a cadence word: a monthly cron guarantees a monthly CYCLE.
# It does not guarantee a monthly PUBLISHED brief, because a cycle whose checks
# fail HOLDS the brief as a draft and tells the founder why, and a month in
# which Oracle shipped nothing new publishes nothing. Both are correct outcomes
# and neither is silent. See legal ledger row 9b in SESSION_HANDOFF.md.
#
# WHAT MUST BE INSTALLED BEFORE THIS CRON MEANS ANYTHING ON PRODUCTION:
# migrations 0004 and 0005, BEEHIIV_MEMBERS_SEGMENT_ID (without it the brief
# publishes and the send holds at `no_segment`), and WATCH_NOTIFY_WEBHOOK if the
# acknowledgement is to reach anywhere other than the Workers log and D1.
#
# Verifying the DRAFTING half needs no cron at all: POST /api/watch/run takes
# exactly the same path behind the same token, and stops at the draft.
[triggers]
# MONTHLY, TIMED TWO DAYS AFTER ORACLE PUBLISHES. Founder ruling 9 Aug 2026.
#
# Oracle ships security content on the THIRD TUESDAY OF EVERY MONTH: quarterly
# Critical Patch Updates in January, April, July and October, and Critical
# Security Patch Updates on the third Tuesday of the other eight months. Read
# off oracle.com/security-alerts/, not recalled. Two days later is the third
# Thursday.
#
# `THU#3` is Quartz "third Thursday" syntax, which Cloudflare supports in the
# weekday field. It is written this way ON PURPOSE rather than as a day-of-month
# range: standard cron ORs a restricted day-of-month with a restricted weekday,
# so `15-21 * THU` would fire every Thursday AND every day from the 15th to the
# 21st. Leaving day-of-month as `*` removes that trap entirely.
#
# Note also that Cloudflare numbers weekdays 1=Sunday to 7=Saturday, unlike most
# cron systems. The abbreviation avoids the ambiguity.
crons = ["0 6 * * THU#3"]

# ------------------------------------------------------------------- PREVIEW

[env.preview]
name = "oradiscuss-site-preview"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/changelog", "/changelog/", "/watch", "/watch/*"]

[env.preview.observability]
enabled = true

[env.preview.vars]
ENVIRONMENT = "preview"
# SITE_ORIGIN is deliberately NOT set here, and the reason is worth writing down
# rather than leaving as an omission. Preview has no cron, so no scheduled cycle
# ever builds a link on this environment, and inventing a preview hostname that
# nobody has verified would put an unchecked claim in the config. If a preview
# rehearsal of the send is ever wanted, set it then, to the host that answered.

[[env.preview.d1_databases]]
binding = "DB"
database_name = "oradiscuss-preview"
database_id = "387a1c7a-0ae6-4479-a73a-d85beb168e21"

[[env.preview.kv_namespaces]]
binding = "ENTITLEMENT"
id = "9c5f1d1719e94163a0ca91f75b5833e0"

[[env.preview.r2_buckets]]
binding = "PACKS"
bucket_name = "oradiscuss-assets-preview"

[env.preview.unsafe]
bindings = [
  { name = "API_RATE_LIMIT", type = "ratelimit", namespace_id = "1001", simple = { limit = 60, period = 60 } },
  { name = "REISSUE_RATE_LIMIT", type = "ratelimit", namespace_id = "1002", simple = { limit = 5, period = 60 } }
]

# The preview queue is a SEPARATE remote resource, the same way preview has its
# own D1, KV and R2. See the note above: neither queue exists yet.

[[env.preview.queues.producers]]
binding = "WEBHOOK_RETRY"
queue = "webhook-retry-preview"

[[env.preview.queues.consumers]]
queue = "webhook-retry-preview"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5

# NO CRON ON PREVIEW, stated explicitly rather than left to inheritance.
#
# Cloudflare's own documentation is why this is written out rather than omitted:
# "if the crons property is an empty array then all the Cron Triggers are
# removed", and "if the triggers or crons property are undefined then the
# currently deployed Cron Triggers are left in-place". Omitting it therefore
# means "whatever is already deployed, plus whatever the top level says", which
# is not a decision. An empty list is the difference between "we decided not to"
# and "nobody thought about it".
#
# AN EMPTY LIST HERE IS ALSO THE KILL SWITCH for the autopublish cycle on this
# environment, and it is why no separate on/off flag was invented for it: with
# no trigger, nothing runs, and nothing can publish except a person with the
# token.
#
# To watch the DRAFTING job run on preview, call POST /api/watch/run with the
# WATCH_ADMIN_TOKEN. It takes the same path the cycle's first stage takes and
# stops before the breaker, so it cannot publish anything.
[env.preview.triggers]
crons = []
